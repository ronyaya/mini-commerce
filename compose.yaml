services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-commerce-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: mini-commerce-postgres

    environment:
      POSTGRES_DB: mini_commerce
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d mini_commerce"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: mini-commerce-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: mini-commerce-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: mini-commerce-queue
      working_dir: /var/www
      volumes:
        - .:/var/www
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy

      command: php artisan queue:work --sleep=1 --tries=3 --timeout=60
volumes:
  postgres_data: